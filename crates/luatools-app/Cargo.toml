[package]
name = "luatools-app"
description = "LuaTools application entry point and service wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
luatools-core = { workspace = true }
luatools-steam = { workspace = true }
luatools-net = { workspace = true }
luatools-downloads = { workspace = true }
luatools-i18n = { workspace = true }
luatools-ui = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
parking_lot = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
zip = { version = "2.6", default-features = false, features = ["deflate"] }
tokio-util = { workspace = true }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }

[dev-dependencies]
tempfile = { workspace = true }
