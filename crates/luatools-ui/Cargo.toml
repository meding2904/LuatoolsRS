[package]
name = "luatools-ui"
description = "egui/eframe user interface: theme, widgets, and pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
luatools-core = { workspace = true }
luatools-i18n = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }
rfd = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }
